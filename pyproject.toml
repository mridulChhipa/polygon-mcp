[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polygon-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Codeforces Polygon problem preparation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
polygon-mcp = "polygon_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polygon_mcp*"]

[tool.setuptools.package-data]
"polygon_mcp" = ["resources/*"]
