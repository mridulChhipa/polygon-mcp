<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Squircle: #0F1015 with rounded corners -->
  <rect width="512" height="512" rx="72" fill="#0F1015"/>

  <!-- Offset Hard Block Shadow: Shifted +18px down and to the right -->
  <!-- Hexagon Points: Flat-topped or pointy-topped regular polygon centered at (256, 256) -->
  <polygon points="274,86 428,175 428,353 274,442 120,353 120,175" fill="#000000"/>

  <!-- Main Polygon: Bold regular hexagon with #FFE600 fill and #FFFFFF hard outline -->
  <polygon points="256,70 410,159 410,337 256,426 102,337 102,159" 
           fill="#FFE600" 
           stroke="#FFFFFF" 
           stroke-width="5" 
           stroke-linejoin="miter"/>

  <!-- Terminal Prompt Chevron '>': Solid #0F1015 thick stroke -->
  <polyline points="190,204 252,248 190,292" 
            fill="none" 
            stroke="#0F1015" 
            stroke-width="26" 
            stroke-linecap="square" 
            stroke-linejoin="miter"/>

  <!-- Terminal Cursor '_': Electric cyan #00F0FF block underscore highlight -->
  <rect x="272" y="276" width="50" height="16" fill="#00F0FF" stroke="#0F1015" stroke-width="2"/>

  <!-- Optional Tiny Hacker Console Accent: One small #D946EF magenta dot in top-right -->
  <rect x="360" y="142" width="10" height="10" fill="#D946EF" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
